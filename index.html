<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

        body {

        /* شاشة المقلب (مخفية بالبداية وتغطي الشاشة بالكامل) */

        }
        #jumpscare img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

</head>
